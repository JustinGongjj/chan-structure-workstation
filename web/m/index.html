      if (!skin) {

      }
      var theme = (q.match(/[?&]theme=(light|dark)/) || [])[1] || localStorage.getItem('chan-theme');
      if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.skin = skin;
      document.documentElement.classList.add(skin === 'android' ? 'md' : 'ios');
      document.documentElement.dataset.theme = theme;
      if (/[?&]skin=/.test(q)) localStorage.setItem('chan-skin', skin);
      if (/[?&]theme=/.test(q)) localStorage.setItem('chan-theme', theme);
      var tc = theme === 'light' ? '#f2f5f9' : '#0a0d13';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', tc);
    } catch (e) {}
  })();
